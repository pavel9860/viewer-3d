<!doctype html>
<meta charset="utf-8">
<title>Render bench</title>
<style>body { font: 12px monospace; background: #111; color: #ddd; padding: 12px }</style>
<pre id="o"></pre>
<!-- median 800x600 frame time over 14 view directions per model; ?m=NAME.mesh for one model -->
<script type="module">
import { prepare, camera, createRenderer, DIRS } from './raster.js';
const o = document.getElementById('o'), log = s => { o.textContent += s + '\n'; };
const params = new URLSearchParams(location.search), threads = +(params.get('w') || 4);
const list = params.get('m') ? params.get('m').split(',') : await (await fetch('meshes/index.json')).json();
for (const name of list) {
  const m = prepare(await (await fetch('meshes/' + name)).arrayBuffer());
  const R = await createRenderer(m, threads), ts = [];
  for (const d of DIRS) {
    const cam = camera(d, [0, 0], 2.5);
    await R.render(cam, 800, 600, { edges: true });
    let best = Infinity;
    for (let i = 0; i < 7; i++) { const t0 = performance.now(); await R.render(cam, 800, 600, { edges: true }); best = Math.min(best, performance.now() - t0); }
    ts.push(best);
  }
  ts.sort((a, b) => a - b);
  log(`${name.padEnd(24)} ${String(m.nt).padStart(7)} tris  ${R.threads} threads  median ${ts[ts.length >> 1].toFixed(2)} ms  max ${ts[ts.length - 1].toFixed(2)} ms`);
}
log('DONE');
fetch('/result', { method: 'POST', body: o.textContent }).catch(() => {});
</script>
